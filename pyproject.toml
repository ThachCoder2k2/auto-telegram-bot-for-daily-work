[project]
name = "clawbot-daily-intel-telegram"
version = "0.1.0"
description = "Daily Telegram intelligence briefing for game/web development and IELTS practice"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.28.1",
  "lxml>=5.3.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
daily-intel-bot = "daily_intel_bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"
